<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de cadastro</title>
    <link rel=”stylesheet” href=”index.css”>
</head>
<body>
    <form action="pag.jap" mathop="get" name="cadastro"></form>
     <fieldset>
        <p><legend><h1>Form Name</h1></legend></p><hr>
        <p><label>Nome:</label>
            <input type="text" name="nome" size="30" placeholder="nome completo"> <br>
        </p>
        <p><label>Data de nascimento:</label>
            <input type="" name="data"> <br>
        </p>
        <p><label>Endereço:</label>
            <input type="text" size="30"><br>
        </p>
        <p><label>Rno:</label>
            <input type="" size="30"><br>
        </p>
        <p><label>Cidade:</label>
           <input type="text" size="30" placeholder="diga sua cidade"><br>
        </p>
        <p><label>Estado:</label>
            <select name="estado">
                <option value="ac">Acre</option>
                <option value="al">Alagoas</option>
                <option value="ap">Amapá</option>
                <option value="am">Amazonas</option>
                <option value="ba">Bahia</option>
                <option value="ce">Ceará</option>
                <option value="df">Distrito Federal</option>
                <option value="es">Espírito Santo</option>
                <option value="go">Goiás</option>
                <option value="ma">Maranhão</option>
               <option value="mt"> Mato Grosso</option>
               <option value="ms">Mato Grosso do Sul</option>
               <option value="mg">Minas Gerais</option>
               <option value="pa">Pará</option>
               <option value="bp">Paraíba</option>
               <option value="pr">Paraná</option>
               <option value="pe">Pernambuco</option>
               <option value="pi">Piauí</option>
               <option value="rj">Rio de Janeiro</option>
               <option value="rn">Rio Grande do Norte</option>
               <option value="rs">Rio Grande do Sul</option>
               <option value="ro">Rondônia</option>
               <option value="rr">Roraima</option>
               <option value="">Santa Catarina</option>
               <option value="sp">São Paulo</option>
               <option value="se">Sergipe</option>
               <option value="to">Tocantins</option>
            </select>
        </p>
        <p><label>Sexo:</label>
            <select name="sexo" id="sexo">
               <option value="f" id="sexo">feminino</option>
               <option value="m" id="sexo">masculino</option>
            </select>
         </p>
        <p><label>Bens pessoas:</label><br>
            <input type="checkbox" id="opcao1" name="caixa" value="casa">
            <label for="opcao1">casa</label><br>
            <input type="checkbox" id="opcao2" name="caixa" value="carro">
            <label for="opcao2">carro</label><br>
            <input type="checkbox" id="opcao3" name="caixa" value="moto">
            <lavel for="opcao3">moto</lavel><br>
        </p>
        <p><label>text area</label>
            <textarea name="text area" id="" placeholder="Experiências Pessoais" size="40"></textarea>
        </p>
        <input type="submit" value="enviar">
        <input type="reset" value="limpa">
    </fieldset>
    </form>
</body>
</html>
