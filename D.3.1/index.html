<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>botão</title>
    <style> 
    body{
        font-family: Arial, sans-serif;
    }
    button{
        font-size: 16px;
        font-family: Ariel, sans-serif;
        background-color: white;
        color:blue;
    }
      </style>
</head>
<body>
    <H1>Click!, é mude a cor da página</H1>
    <button id="bAzul">Azul</button>
  
    <script>
        document
        .getElementById("bAzul")
        .addEventListener("click", function () {
          document.body.style.backgroundColor = "blue";
        });
    </script>
</body>
</html>
